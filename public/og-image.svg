  </text>

  <!-- Metrics Chips -->
  <g transform="translate(80, 470)">
    <rect x="0" y="0" width="220" height="80" rx="8" fill="#181b28" stroke="#33343d" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#64748b">CORE WEB VITALS</text>
    <text x="20" y="64" font-family="'Archivo', sans-serif" font-weight="900" font-size="28" fill="#34d399">99 / 100</text>

    <rect x="240" y="0" width="220" height="80" rx="8" fill="#181b28" stroke="#33343d" stroke-width="1.5"/>
    <text x="260" y="32" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#64748b">STREAM LATENCY</text>
    <text x="260" y="64" font-family="'Archivo', sans-serif" font-weight="900" font-size="28" fill="#38bdf8">&lt; 12 ms</text>

    <rect x="480" y="0" width="220" height="80" rx="8" fill="#181b28" stroke="#33343d" stroke-width="1.5"/>
    <text x="500" y="32" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#64748b">WEB3 SCALE</text>
    <text x="500" y="64" font-family="'Archivo', sans-serif" font-weight="900" font-size="28" fill="#ff4500">150K+ Users</text>

    <rect x="720" y="0" width="320" height="80" rx="8" fill="#181b28" stroke="#33343d" stroke-width="1.5"/>
    <text x="740" y="32" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#64748b">VERIFIED LOCATION</text>
    <text x="740" y="64" font-family="'Archivo', sans-serif" font-weight="900" font-size="24" fill="#ffffff">Dubai, UAE (UTC+4)</text>
